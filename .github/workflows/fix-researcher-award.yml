name: Fix Researcher Award

on:
  push:
    paths:
      - '.github/workflows/fix-researcher-award.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make award static and refresh script cache key
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('script.js?v=20260822-1512', 'script.js?v=20260824-award-fix-1')
          old = '<p class="researcher-name">이명훈</p><p class="researcher-lead">'
          new = '<p class="researcher-name">이명훈</p><p class="researcher-award">★ 석사학위논문 논문우수상 수상</p><p class="researcher-lead">'
          if old not in text:
              raise SystemExit('researcher insertion point not found')
          text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          start = js.find("\n  const researcherLead = document.querySelector('.researcher-lead');")
          if start != -1:
              end = js.find('\n})();', start)
              if end == -1:
                  raise SystemExit('script block end not found')
              js = js[:start] + js[end:]
              script.write_text(js, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js
          git commit -m "Render researcher award statically and bust stale cache"
          git push
