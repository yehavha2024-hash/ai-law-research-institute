name: Border Correct
on:
  push:
    paths:
      - '.github/workflows/border-correct.yml'
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/border-correct.mjs
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct AI Law Institute border colors"
          git push
